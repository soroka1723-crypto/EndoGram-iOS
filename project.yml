name: EndoGram
options:
  bundleIdPrefix: ru.endogram
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  EndoGram:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: EndoGram
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations:
          - ru
          - en
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.social-networking
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities:
          - arm64
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        NSMicrophoneUsageDescription: "Микрофон нужен для записи голосовых сообщений. Записи сохраняются только на этом устройстве и никуда не отправляются."
        NSPhotoLibraryUsageDescription: "Доступ к фото нужен, чтобы прикрепить изображение. В офлайн-режиме вложения не отправляются."
    settings:
      base:
        PRODUCT_NAME: EndoGram
        PRODUCT_BUNDLE_IDENTIFIER: ru.endogram.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  EndoGram:
    build:
      targets:
        EndoGram: all
    run:
      config: Release
    archive:
      config: Release
